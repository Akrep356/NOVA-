name: Build NOVA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses:
gradle/actions/setup-gradle@6
        with:
          gradle-version: '8.9'

      - name: Build APK 
        uses:
actions/upload-artifact@v4
        with:
        name: NOVA-debug-APK
        path: app/build/outputs/apk/
debug/*.apk7
