<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA MusicGen</title>
</head>

<body>

<script type="module">

import {
    AutoTokenizer,
    MusicgenForConditionalGeneration
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers";

let tokenizer = null;
let model = null;
let loading = false;
let generating = false;

const TOTAL_CHUNKS = 27;

function sendStatus(message) {

    if (window.AndroidBridge) {

        try {

            window.AndroidBridge.onStatus(
                String(message)
            );

        } catch (error) {

            console.log(
                "AndroidBridge status hatası:",
                error
            );
        }
    }
}

async function loadModel() {

    if (
        model !== null &&
        tokenizer !== null
    ) {

        return true;
    }

    if (loading) {

        sendStatus(
            "MusicGen zaten yükleniyor..."
        );

        while (loading) {

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        500
                    )
            );
        }

        return (
            model !== null &&
            tokenizer !== null
        );
    }

    loading = true;

    try {

        sendStatus(
            "MusicGen yükleniyor..."
        );

        sendStatus(
            "Tokenizer hazırlanıyor..."
        );

        tokenizer =
            await AutoTokenizer.from_pretrained(
                "Xenova/musicgen-small"
            );

        sendStatus(
            "MusicGen modeli yükleniyor..."
        );

        model =
            await MusicgenForConditionalGeneration.from_pretrained(
                "Xenova/musicgen-small",
                {
                    dtype: {
                        text_encoder: "q8",
                        decoder_model_merged: "q8",
                        encodec_decode: "fp32"
                    }
                }
            );

        sendStatus(
            "MusicGen hazır."
        );

        return true;

    } catch (error) {

        tokenizer = null;
        model = null;

        const message =
            error &&
            error.message
                ? error.message
                : String(error);

        sendStatus(
            "MusicGen yükleme hatası: " +
            message
        );

        if (
            window.AndroidBridge
        ) {

            try {

                window.AndroidBridge.onMusicError(
                    "MusicGen yükleme hatası: " +
                    message
                );

            } catch (_) {
            }
        }

        return false;

    } finally {

        loading = false;
    }
}

function floatToWavBase64(
    samples,
    sampleRate
) {

    let audioSamples = samples;

    /*
     * MusicGen bazı sürümlerde Float32Array,
     * bazı sürümlerde Tensor benzeri veri döndürebilir.
     */

    if (
        audioSamples &&
        audioSamples.data
    ) {

        audioSamples =
            audioSamples.data;
    }

    if (
        !audioSamples ||
        audioSamples.length === 0
    ) {

        throw new Error(
            "MusicGen boş ses verisi oluşturdu."
        );
    }

    const buffer =
        new ArrayBuffer(
            44 +
            audioSamples.length * 2
        );

    const view =
        new DataView(buffer);

    function writeString(
        offset,
        string
    ) {

        for (
            let i = 0;
            i < string.length;
            i++
        ) {

            view.setUint8(
                offset + i,
                string.charCodeAt(i)
            );
        }
    }

    writeString(
        0,
        "RIFF"
    );

    view.setUint32(
        4,
        36 +
        audioSamples.length * 2,
        true
    );

    writeString(
        8,
        "WAVE"
    );

    writeString(
        12,
        "fmt "
    );

    view.setUint32(
        16,
        16,
        true
    );

    view.setUint16(
        20,
        1,
        true
    );

    view.setUint16(
        22,
        1,
        true
    );

    view.setUint32(
        24,
        sampleRate,
        true
    );

    view.setUint32(
        28,
        sampleRate * 2,
        true
    );

    view.setUint16(
        32,
        2,
        true
    );

    view.setUint16(
        34,
        16,
        true
    );

    writeString(
        36,
        "data"
    );

    view.setUint32(
        40,
        audioSamples.length * 2,
        true
    );

    let offset = 44;

    for (
        let i = 0;
        i < audioSamples.length;
        i++
    ) {

        let sample =
            Number(
                audioSamples[i]
            );

        if (
            !Number.isFinite(sample)
        ) {

            sample = 0;
        }

        sample =
            Math.max(
                -1,
                Math.min(
                    1,
                    sample
                )
            );

        sample =
            sample < 0
                ? sample * 32768
                : sample * 32767;

        view.setInt16(
            offset,
            sample,
            true
        );

        offset += 2;
    }

    const bytes =
        new Uint8Array(
            buffer
        );

    let binary = "";

    const chunkSize =
        0x8000;

    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk =
            bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            );

        binary +=
            String.fromCharCode.apply(
                null,
                chunk
            );
    }

    return btoa(
        binary
    );
}

async function generateSingleChunk(
    prompt,
    chunkIndex
) {

    sendStatus(
        "Müzik bölümü " +
        (chunkIndex + 1) +
        " / " +
        TOTAL_CHUNKS +
        " oluşturuluyor..."
    );

    const inputs =
        tokenizer(
            prompt
        );

    const audioValues =
        await model.generate({

            ...inputs,

            max_new_tokens: 500,

            do_sample: true,

            guidance_scale: 3
        });

    let audioData =
        audioValues;

    if (
        audioValues &&
        audioValues.data
    ) {

        audioData =
            audioValues.data;
    }

    if (
        !audioData ||
        !audioData.length
    ) {

        throw new Error(
            "Bölüm " +
            (chunkIndex + 1) +
            " için ses verisi alınamadı."
        );
    }

    const sampleRate =
        model
            .config
            .audio_encoder
            .sampling_rate;

    const wavBase64 =
        floatToWavBase64(
            audioData,
            sampleRate
        );

    if (
        window.AndroidBridge
    ) {

        window.AndroidBridge.onMusicChunk(
            wavBase64,
            chunkIndex,
            TOTAL_CHUNKS,
            sampleRate
        );
    }

    return true;
}

window.generateMusic =
    async function(promptText) {

        if (generating) {

            sendStatus(
                "Zaten bir müzik oluşturuluyor. Lütfen bekleyin."
            );

            return;
        }

        generating = true;

        try {

            if (
                !promptText ||
                promptText.trim() === ""
            ) {

                sendStatus(
                    "Önce nasıl bir müzik istediğini yaz."
                );

                return;
            }

            const modelReady =
                await loadModel();

            if (
                !modelReady ||
                !model ||
                !tokenizer
            ) {

                sendStatus(
                    "MusicGen hazır değil."
                );

                return;
            }

            const prompt =
                promptText.trim();

            const sampleRate =
                model
                    .config
                    .audio_encoder
                    .sampling_rate;

            sendStatus(
                "MusicGen hazır. " +
                sampleRate +
                " Hz ses kullanılacak."
            );

            sendStatus(
                "4 dakika 30 saniyelik müzik hazırlanıyor..."
            );

            for (
                let chunkIndex = 0;
                chunkIndex < TOTAL_CHUNKS;
                chunkIndex++
            ) {

                await generateSingleChunk(
                    prompt,
                    chunkIndex
                );

                /*
                 * WebView'ın Android Bridge'e
                 * nefes alması için kısa bekleme.
                 */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            150
                        )
                );
            }

            if (
                window.AndroidBridge
            ) {

                window.AndroidBridge
                    .onMusicComplete();
            }

            sendStatus(
                "27 bölüm tamamlandı. " +
                "4 dakika 30 saniyelik müzik hazırlanıyor..."
            );

        } catch (error) {

            const message =
                error &&
                error.message
                    ? error.message
                    : String(error);

            sendStatus(
                "Müzik oluşturma hatası: " +
                message
            );

            if (
                window.AndroidBridge
            ) {

                try {

                    window.AndroidBridge
                        .onMusicError(
                            message
                        );

                } catch (_) {
                }
            }

        } finally {

            generating = false;
        }
    };

sendStatus(
    "NOVA MusicGen hazır."
);

</script>

</body>
</html>
