<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA MusicGen</title>
</head>

<body>

<script type="module">

import {
    AutoTokenizer,
    MusicgenForConditionalGeneration
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers";

let tokenizer = null;
let model = null;
let loading = false;

function sendStatus(message) {
    if (window.AndroidBridge) {
        window.AndroidBridge.onStatus(message);
    }
}

async function loadModel() {

    if (model !== null) {
        return;
    }

    if (loading) {
        return;
    }

    loading = true;

    try {

        sendStatus("MusicGen yükleniyor...");

        tokenizer = await AutoTokenizer.from_pretrained(
            "Xenova/musicgen-small"
        );

        model = await MusicgenForConditionalGeneration.from_pretrained(
            "Xenova/musicgen-small",
            {
                dtype: {
                    text_encoder: "q8",
                    decoder_model_merged: "q8",
                    encodec_decode: "fp32"
                }
            }
        );

        sendStatus("MusicGen hazır.");

    } catch (error) {

        sendStatus("MusicGen yükleme hatası: " + error);

    } finally {

        loading = false;
    }
}


function floatToWavBase64(samples, sampleRate) {

    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);

    function writeString(offset, string) {

        for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
        }
    }

    writeString(0, "RIFF");

    view.setUint32(
        4,
        36 + samples.length * 2,
        true
    );

    writeString(8, "WAVE");

    writeString(12, "fmt ");

    view.setUint32(16, 16, true);

    view.setUint16(20, 1, true);

    view.setUint16(22, 1, true);

    view.setUint32(24, sampleRate, true);

    view.setUint32(
        28,
        sampleRate * 2,
        true
    );

    view.setUint16(32, 2, true);

    view.setUint16(34, 16, true);

    writeString(36, "data");

    view.setUint32(
        40,
        samples.length * 2,
        true
    );

    let offset = 44;

    for (let i = 0; i < samples.length; i++) {

        let sample = Math.max(
            -1,
            Math.min(1, samples[i])
        );

        sample =
            sample < 0
                ? sample * 32768
                : sample * 32767;

        view.setInt16(
            offset,
            sample,
            true
        );

        offset += 2;
    }

    const bytes = new Uint8Array(buffer);

    let binary = "";

    const chunkSize = 0x8000;

    for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ) {

        const chunk = bytes.subarray(
            i,
            Math.min(
                i + chunkSize,
                bytes.length
            )
        );

        binary += String.fromCharCode.apply(
            null,
            chunk
        );
    }

    return btoa(binary);
}


window.generateMusic = async function(promptText) {

    try {

        if (!promptText || promptText.trim() === "") {

            sendStatus(
                "Önce nasıl bir müzik istediğini yaz."
            );

            return;
        }

        await loadModel();

        if (!model || !tokenizer) {

            sendStatus(
                "MusicGen hazır değil."
            );

            return;
        }

        sendStatus(
            "Müzik oluşturuluyor..."
        );

        const prompt = promptText.trim();

        const inputs = tokenizer(prompt);

        const audioValues =
            await model.generate({

                ...inputs,

                max_new_tokens: 500,

                do_sample: true,

                guidance_scale: 3

            });

        const sampleRate =
            model.config.audio_encoder.sampling_rate;

        const audioData =
            audioValues.data;

        const wavBase64 =
            floatToWavBase64(
                audioData,
                sampleRate
            );

        if (window.AndroidBridge) {

            window.AndroidBridge.onMusicGenerated(
                wavBase64
            );
        }

        sendStatus(
            "Müzik hazır."
        );

    } catch (error) {

        sendStatus(
            "Müzik oluşturma hatası: " +
            error
        );
    }
};


</script>

</body>
</html>
