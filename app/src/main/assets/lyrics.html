<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA Şarkı Sözleri</title>

    <style>
        body {
            background: #111318;
            color: white;
            font-family: sans-serif;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            background: #1c1f26;
            color: white;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #7c4dff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        #musicButton {
            display: none;
            background: #00a86b;
        }

        #status {
            margin-top: 15px;
            margin-bottom: 15px;
            color: #bbbbbb;
            text-align: center;
            font-size: 16px;
        }

        #result {
            margin-top: 5px;
            min-height: 250px;
        }
    </style>
</head>

<body>

<h2>🎵 NOVA Şarkı Sözleri</h2>

<textarea
    id="prompt"
    rows="4"
    placeholder="Şarkının konusu ve tarzını yaz...
Örnek: Aşkını kaybeden birinin yeniden umut bulması, Türkçe pop"
></textarea>

<button onclick="generateLyrics()">
    🎤 ŞARKI SÖZÜ OLUŞTUR
</button>

<div id="status">Hazır</div>

<textarea
    id="result"
    rows="14"
    placeholder="Oluşturulan şarkı sözleri burada görünecek..."
></textarea>

<button
    id="musicButton"
    onclick="createMusicWithLyrics()"
>
    🎵 BU SÖZLERLE MÜZİK OLUŞTUR
</button>

<script type="module">

import { pipeline } from
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers";

let generator = null;

let generatedLyrics = "";

async function loadModel() {

    if (generator !== null) {
        return;
    }

    document.getElementById("status").innerText =
        "Yapay zekâ modeli yükleniyor...";

    generator = await pipeline(
        "text2text-generation",
        "Xenova/mt5-small",
        {
            dtype: "q8"
        }
    );
}

function cleanLyrics(text) {

    if (!text) {
        return "";
    }

    let cleaned = text;

    cleaned = cleaned.replace(
        /<extra_id_\d+>/gi,
        ""
    );

    cleaned = cleaned.replace(
        /<pad>/gi,
        ""
    );

    cleaned = cleaned.replace(
        /<\/s>/gi,
        ""
    );

    cleaned = cleaned.replace(
        /^extra_id_\d+\s*:\s*/i,
        ""
    );

    cleaned = cleaned.replace(
        /^:\s*/,
        ""
    );

    cleaned = cleaned.trim();

    return cleaned;
}

window.generateLyrics = async function() {

    const prompt =
        document.getElementById("prompt")
            .value
            .trim();

    if (!prompt) {

        document.getElementById("status").innerText =
            "Lütfen şarkının konusunu yaz.";

        return;
    }

    const musicButton =
        document.getElementById("musicButton");

    musicButton.style.display = "none";

    try {

        await loadModel();

        document.getElementById("status").innerText =
            "Şarkı sözleri oluşturuluyor...";

        const instruction =
`
Türkçe şarkı sözleri yaz.

KONU VE TARZ:
${prompt}

Şarkıyı şu sırayla yaz:

[Kıta 1]
4 satır

[Nakarat]
4 satır

[Kıta 2]
4 satır

[Nakarat]
4 satır

[Köprü]
4 satır

[Son Nakarat]
4 satır

Sadece şarkı sözlerini yaz.
Açıklama yazma.
İngilizce yazma.
Özel XML veya model tokenları kullanma.
Anlamlı, akıcı ve kafiyeli Türkçe kullan.
`;

        const output =
            await generator(
                instruction,
                {
                    max_new_tokens: 450,
                    do_sample: true,
                    temperature: 0.9,
                    top_k: 50
                }
            );

        let lyrics = "";

        if (
            output &&
            output[0] &&
            output[0].generated_text
        ) {

            lyrics =
                output[0].generated_text;
        }

        lyrics =
            cleanLyrics(lyrics);

        if (
            !lyrics ||
            lyrics.length < 20
        ) {

            throw new Error(
                "Model anlamlı şarkı sözü üretemedi. Lütfen tekrar dene."
            );
        }

        generatedLyrics =
            lyrics;

        document.getElementById("result").value =
            lyrics;

        document.getElementById("status").innerText =
            "✅ Şarkı sözleri hazır.";

        musicButton.style.display =
            "block";

        if (
            typeof AndroidBridge !== "undefined" &&
            AndroidBridge.onLyricsGenerated
        ) {

            AndroidBridge.onLyricsGenerated(
                lyrics
            );
        }

    } catch (error) {

        console.error(error);

        document.getElementById("status").innerText =
            "❌ Hata: " +
            error.message;

        musicButton.style.display =
            "none";

        if (
            typeof AndroidBridge !== "undefined" &&
            AndroidBridge.onLyricsError
        ) {

            AndroidBridge.onLyricsError(
                error.message
            );
        }
    }
};

window.createMusicWithLyrics =
    function() {

        const lyrics =
            document.getElementById("result")
                .value
                .trim();

        if (!lyrics) {

            document.getElementById("status").innerText =
                "Önce şarkı sözü oluştur.";

            return;
        }

        document.getElementById("status").innerText =
            "🎵 Sözler NOVA müzik sistemine gönderiliyor...";

        if (
            typeof AndroidBridge !== "undefined" &&
            AndroidBridge.onLyricsMusicRequested
        ) {

            AndroidBridge.onLyricsMusicRequested(
                lyrics
            );

        } else {

            document.getElementById("status").innerText =
                "❌ NOVA müzik bağlantısı bulunamadı.";
        }
    };

</script>

</body>
</html>
