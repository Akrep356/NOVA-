<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NOVA Şarkı Sözleri</title>

<style>

body {
  background: #111318;
  color: white;
  font-family: sans-serif;
  padding: 20px;
  margin: 0;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

textarea {
  width: 100%;
  box-sizing: border-box;
  background: #1c1f26;
  color: white;
  border: 1px solid #444;
  border-radius: 10px;
  padding: 12px;
  font-size: 16px;
  margin-bottom: 12px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 12px;
}

#generateButton {
  background: #7c4dff;
}

#musicButton {
  background: #22a06b;
  display: none;
}

button:disabled {
  opacity: 0.5;
}

#status {
  margin-top: 10px;
  margin-bottom: 10px;
  color: #bbbbbb;
  text-align: center;
  min-height: 24px;
}

#result {
  margin-top: 10px;
  min-height: 320px;
}

.info {
  color: #999;
  font-size: 13px;
  text-align: center;
  margin-top: 10px;
}

</style>

</head>

<body>

<h2>🎵 NOVA Şarkı Sözleri</h2>

<label for="prompt">
  🎵 Şarkı konusu
</label>

<textarea
  id="prompt"
  rows="5"
  placeholder="Örnek: Aşkını kaybeden birinin yeniden umut bulması, Türkçe pop, duygusal ama umutlu"
></textarea>

<button
  id="generateButton"
  onclick="generateLyrics()"
>
  🎤 ŞARKI SÖZÜ OLUŞTUR
</button>

<div id="status">
  Hazır
</div>

<textarea
  id="result"
  rows="16"
  placeholder="Oluşturulan şarkı sözleri burada görünecek..."
></textarea>

<button
  id="musicButton"
  onclick="createMusicWithLyrics()"
>
  🎵 BU SÖZLERLE MÜZİK OLUŞTUR
</button>

<div class="info">
  NOVA yapay zekâ ile Türkçe şarkı sözleri oluşturur.
</div>


<script>

const NOVA_SERVER =
  "https://nova-cf5h.onrender.com";

let lastLyrics = "";


/*
 * ============================================================
 * ŞARKI SÖZÜ OLUŞTUR
 * ============================================================
 */

window.generateLyrics = async function() {

  const promptElement =
    document.getElementById("prompt");

  const resultElement =
    document.getElementById("result");

  const statusElement =
    document.getElementById("status");

  const generateButton =
    document.getElementById("generateButton");

  const musicButton =
    document.getElementById("musicButton");

  const prompt =
    promptElement.value.trim();


  if (!prompt) {

    statusElement.innerText =
      "⚠️ Lütfen şarkının konusunu yaz.";

    promptElement.focus();

    return;
  }


  generateButton.disabled = true;

  musicButton.style.display = "none";

  resultElement.value = "";

  lastLyrics = "";


  statusElement.innerText =
    "⏳ Yapay zekâ hazırlanıyor...";


  try {

    /*
     * Render ücretsiz sunucusu boşta kaldıysa
     * ilk bağlantı biraz uzun sürebilir.
     */

    statusElement.innerText =
      "⏳ NOVA sunucusuna bağlanılıyor...";


    const response = await fetch(
      NOVA_SERVER + "/generate-lyrics",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          topic: prompt
        })
      }
    );


    const responseText =
      await response.text();


    let data;

    try {

      data = JSON.parse(responseText);

    } catch (parseError) {

      throw new Error(
        "Sunucudan geçersiz cevap geldi."
      );

    }


    if (!response.ok) {

      const serverError =
        data?.error ||
        "Şarkı sözü oluşturulamadı.";

      throw new Error(serverError);

    }


    const lyrics =
      typeof data?.lyrics === "string"
        ? data.lyrics.trim()
        : "";


    if (!lyrics) {

      throw new Error(
        "Yapay zekâ şarkı sözü döndürmedi."
      );

    }


    lastLyrics = lyrics;

    resultElement.value = lyrics;


    statusElement.innerText =
      "✅ Şarkı sözleri hazır.";


    musicButton.style.display =
      "block";


    /*
     * Android tarafına sözlerin hazır olduğunu bildir.
     */

    if (
      typeof AndroidBridge !== "undefined" &&
      AndroidBridge.onLyricsGenerated
    ) {

      AndroidBridge.onLyricsGenerated(
        lyrics
      );

    }

  } catch (error) {

    console.error(
      "NOVA lyrics error:",
      error
    );


    const message =
      error?.message ||
      "Bilinmeyen hata";


    statusElement.innerText =
      "❌ Hata: " + message;


    if (
      typeof AndroidBridge !== "undefined" &&
      AndroidBridge.onLyricsError
    ) {

      AndroidBridge.onLyricsError(
        message
      );

    }

  } finally {

    generateButton.disabled = false;

  }

};


/*
 * ============================================================
 * BU SÖZLERLE MÜZİK OLUŞTUR
 * ============================================================
 */

window.createMusicWithLyrics = function() {

  const resultElement =
    document.getElementById("result");

  const statusElement =
    document.getElementById("status");

  const lyrics =
    (
      lastLyrics ||
      resultElement.value ||
      ""
    ).trim();


  if (!lyrics) {

    statusElement.innerText =
      "⚠️ Önce şarkı sözü oluştur.";

    return;

  }


  statusElement.innerText =
    "🎵 Şarkı sözleri müzik sistemine gönderiliyor...";


  if (
    typeof AndroidBridge !== "undefined" &&
    AndroidBridge.onLyricsMusicRequested
  ) {

    AndroidBridge.onLyricsMusicRequested(
      lyrics
    );

    return;

  }


  statusElement.innerText =
    "❌ Android müzik sistemi bulunamadı.";

};


/*
 * ============================================================
 * SAYFA HAZIR
 * ============================================================
 */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const statusElement =
      document.getElementById("status");

    statusElement.innerText =
      "Hazır — şarkı konusunu yaz.";

  }
);

</script>

</body>

</html>
