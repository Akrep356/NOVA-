<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>NOVA - Şarkı Sözü Oluştur</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #09090f;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-top: 10px;
            color: #b56cff;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .label {
            display: block;
            margin: 15px 0 8px 4px;
            color: #ddd;
            font-size: 16px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            background: #151522;
            color: white;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #b56cff;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 16px;
            margin-top: 15px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #7b2cff, #b000ff);
        }

        button:disabled {
            opacity: 0.5;
        }

        #musicButton {
            display: none;
            background: linear-gradient(135deg, #00a86b, #00d084);
        }

        #status {
            margin-top: 18px;
            padding: 14px;
            background: #12121c;
            border-radius: 10px;
            color: #bbb;
            line-height: 1.5;
            min-height: 50px;
            white-space: pre-line;
        }

        #result {
            margin-top: 15px;
            min-height: 320px;
        }

        .loading {
            color: #b56cff;
        }

        .success {
            color: #45e68b;
        }

        .error {
            color: #ff5c5c;
        }

    </style>
</head>

<body>

    <h1>🎤 NOVA</h1>

    <div class="subtitle">
        AI Şarkı Sözü Oluştur
    </div>


    <label class="label">
        🎵 Şarkı konusu
    </label>


    <textarea
        id="prompt"
        placeholder="Örnek: Aşkını kaybeden birinin yeniden umut bulması"
    ></textarea>


    <button
        id="generateButton"
        onclick="generateLyrics()"
    >
        🎤 ŞARKI SÖZÜ OLUŞTUR
    </button>


    <div id="status">
        Hazır. Şarkının konusunu yaz ve oluştur.
    </div>


    <textarea
        id="result"
        placeholder="Oluşturulan şarkı sözleri burada görünecek..."
    ></textarea>


    <button
        id="musicButton"
        onclick="createMusicWithLyrics()"
    >
        🎵 BU SÖZLERLE MÜZİK OLUŞTUR
    </button>


    <script type="module">

        import {
            pipeline
        } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


        let generator = null;


        const promptBox =
            document.getElementById("prompt");

        const resultBox =
            document.getElementById("result");

        const statusBox =
            document.getElementById("status");

        const generateButton =
            document.getElementById("generateButton");

        const musicButton =
            document.getElementById("musicButton");


        function setStatus(message, type = "") {

            statusBox.className = type;

            statusBox.textContent = message;
        }


        function cleanLyrics(text) {

            if (!text) {
                return "";
            }

            let lyrics = String(text);


            lyrics = lyrics
                .replace(/<\|im_start\|>/gi, "")
                .replace(/<\|im_end\|>/gi, "")
                .replace(/<\|endoftext\|>/gi, "")
                .replace(/<\|endofprompt\|>/gi, "")
                .replace(/<extra_id_\d+>/gi, "")
                .replace(/<pad>/gi, "")
                .replace(/<\/s>/gi, "")
                .replace(/<s>/gi, "")
                .replace(/^assistant\s*:/gim, "")
                .trim();


            return lyrics;
        }


        async function loadModel() {

            if (generator) {
                return;
            }


            setStatus(
                "🧠 NOVA şarkı sözü yapay zekâsı hazırlanıyor...\n\n" +
                "İlk kullanımda model telefona indiriliyor.\n" +
                "Model büyük olduğu için bu işlem biraz sürebilir.\n" +
                "Lütfen uygulamayı kapatma.",
                "loading"
            );


            generator = await pipeline(
                "text-generation",
                "onnx-community/Qwen2.5-1.5B-Instruct",
                {
                    dtype: "q4"
                }
            );
        }


        function getAssistantText(output) {

            if (!output || !output.length) {
                return "";
            }


            const generated =
                output[0]?.generated_text;


            if (!generated) {
                return "";
            }


            if (Array.isArray(generated)) {

                const lastMessage =
                    generated[generated.length - 1];


                if (
                    lastMessage &&
                    lastMessage.role === "assistant"
                ) {

                    return cleanLyrics(
                        lastMessage.content || ""
                    );
                }


                const assistantMessage =
                    [...generated]
                        .reverse()
                        .find(
                            message =>
                                message &&
                                message.role === "assistant"
                        );


                if (assistantMessage) {

                    return cleanLyrics(
                        assistantMessage.content || ""
                    );
                }
            }


            return cleanLyrics(generated);
        }


        function looksLikeLyrics(text) {

            if (!text) {
                return false;
            }


            if (text.length < 80) {
                return false;
            }


            const lower =
                text.toLocaleLowerCase("tr-TR");


            const badPhrases = [

                "ödeme sonunda",
                "size yardımcı",
                "bu yazıda",
                "birkaç tane",
                "söndürüyoruz",
                "sütuna",
                "kubra",
                "kullanacağım",
                "yardımcı olmak için",
                "şarkı sözlerini kullanacağım"
            ];


            for (const phrase of badPhrases) {

                if (lower.includes(phrase)) {
                    return false;
                }
            }


            const lyricWords = [

                "nakarat",
                "kıta",
                "köprü",
                "aşk",
                "kalp",
                "gece",
                "göz",
                "yol",
                "umut",
                "sevda",
                "özlem",
                "hayat"
            ];


            let score = 0;


            for (const word of lyricWords) {

                if (lower.includes(word)) {
                    score++;
                }
            }


            const lineCount =
                text.split("\n").filter(
                    line => line.trim().length > 0
                ).length;


            return score >= 2 && lineCount >= 5;
        }


        window.generateLyrics = async function() {

            const userPrompt =
                promptBox.value.trim();


            if (!userPrompt) {

                setStatus(
                    "❌ Önce şarkının konusunu yaz.",
                    "error"
                );

                return;
            }


            generateButton.disabled = true;

            musicButton.style.display = "none";

            resultBox.value = "";


            try {

                await loadModel();


                setStatus(
                    "✍️ NOVA şarkı sözlerini yazıyor...\n\n" +
                    "Bu işlem telefonda gerçekleşiyor.\n" +
                    "Lütfen bekle.",
                    "loading"
                );


                const messages = [

                    {
                        role: "system",

                        content:
                            "Sen yalnızca Türkçe şarkı sözü yazan profesyonel bir söz yazarı ol. " +
                            "Kullanıcının verdiği konuyu temel al. " +
                            "Özgün ve doğal Türkçe kullan. " +
                            "Şarkı sözünde [Kıta 1], [Nakarat], [Kıta 2], [Nakarat], [Köprü], [Son Nakarat] bölümleri kullan. " +
                            "Nakarat güçlü ve akılda kalıcı olsun. " +
                            "Her bölümde gerçek şarkı dizeleri yaz. " +
                            "Açıklama yapma. " +
                            "Kullanıcıya cevap verme. " +
                            "Ödeme, yapay zekâ, model, yazı yazma, yardım, sistem veya teknik konulardan bahsetme. " +
                            "Sadece şarkı sözünü üret."
                    },

                    {
                        role: "user",

                        content:
                            "Türkçe bir şarkı yaz.\n\n" +
                            "ŞARKI KONUSU:\n" +
                            userPrompt +
                            "\n\n" +
                            "Şarkı doğrudan sözlerle başlasın. " +
                            "Yaklaşık 3-4 kıta, güçlü bir nakarat, bir köprü ve final nakaratı olsun. " +
                            "Duygusal olarak tutarlı, söylenebilir ve özgün olsun."
                    }

                ];


                const output =
                    await generator(
                        messages,
                        {
                            max_new_tokens: 500,
                            do_sample: true,
                            temperature: 0.75,
                            top_p: 0.9,
                            repetition_penalty: 1.08
                        }
                    );


                let lyrics =
                    getAssistantText(output);


                lyrics =
                    cleanLyrics(lyrics);


                if (!looksLikeLyrics(lyrics)) {

                    throw new Error(
                        "Yapay zekâ düzgün şarkı sözü oluşturamadı. Lütfen tekrar dene."
                    );
                }


                resultBox.value =
                    lyrics;


                setStatus(
                    "✅ Şarkı sözleri başarıyla oluşturuldu.",
                    "success"
                );


                musicButton.style.display =
                    "block";


                if (
                    window.AndroidBridge &&
                    typeof window.AndroidBridge.onLyricsGenerated ===
                        "function"
                ) {

                    window.AndroidBridge.onLyricsGenerated(
                        lyrics
                    );
                }

            }
            catch (error) {

                console.error(error);


                const message =
                    error?.message ||
                    String(error) ||
                    "Bilinmeyen hata";


                setStatus(
                    "❌ Hata: " + message,
                    "error"
                );


                resultBox.value = "";

                musicButton.style.display =
                    "none";


                if (
                    window.AndroidBridge &&
                    typeof window.AndroidBridge.onLyricsError ===
                        "function"
                ) {

                    window.AndroidBridge.onLyricsError(
                        message
                    );
                }

            }
            finally {

                generateButton.disabled =
                    false;
            }
        };


        window.createMusicWithLyrics =
            function() {

                const lyrics =
                    cleanLyrics(
                        resultBox.value.trim()
                    );


                if (
                    !lyrics ||
                    lyrics.length < 30
                ) {

                    setStatus(
                        "❌ Önce geçerli şarkı sözleri oluştur.",
                        "error"
                    );

                    return;
                }


                setStatus(
                    "🎵 Şarkı sözleri müzik sistemine gönderiliyor...",
                    "loading"
                );


                if (
                    window.AndroidBridge &&
                    typeof window.AndroidBridge.onLyricsMusicRequested ===
                        "function"
                ) {

                    window.AndroidBridge.onLyricsMusicRequested(
                        lyrics
                    );

                } else {

                    setStatus(
                        "❌ Android müzik bağlantısı bulunamadı.",
                        "error"
                    );
                }
            };


        setStatus(
            "Hazır. Şarkının konusunu yaz ve oluştur.",
            ""
        );

    </script>

</body>
</html>
