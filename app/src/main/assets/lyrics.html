<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>NOVA - Şarkı Sözü Oluştur</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #09090f;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-top: 10px;
            color: #b56cff;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .label {
            display: block;
            margin: 15px 0 8px 4px;
            color: #ddd;
            font-size: 16px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            background: #151522;
            color: white;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #b56cff;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 16px;
            margin-top: 15px;
            font-size: 17px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #7b2cff, #b000ff);
        }

        button:disabled {
            opacity: 0.5;
        }

        #musicButton {
            display: none;
            background: linear-gradient(135deg, #00a86b, #00d084);
        }

        #status {
            margin-top: 18px;
            padding: 14px;
            background: #12121c;
            border-radius: 10px;
            color: #bbb;
            line-height: 1.5;
            min-height: 50px;
            white-space: pre-line;
        }

        #result {
            margin-top: 15px;
            min-height: 320px;
        }

        .loading {
            color: #b56cff;
        }

        .success {
            color: #45e68b;
        }

        .error {
            color: #ff5c5c;
        }

    </style>
</head>

<body>

    <h1>🎤 NOVA</h1>

    <div class="subtitle">
        AI Şarkı Sözü Oluştur
    </div>


    <label class="label">
        🎵 Şarkı konusu
    </label>

    <textarea
        id="prompt"
        placeholder="Örnek: Aşkını kaybeden birinin yeniden umut bulması"
    ></textarea>


    <button
        id="generateButton"
        onclick="generateLyrics()"
    >
        🎤 ŞARKI SÖZÜ OLUŞTUR
    </button>


    <div id="status">
        Hazır. Şarkının konusunu yaz ve oluştur.
    </div>


    <textarea
        id="result"
        placeholder="Oluşturulan şarkı sözleri burada görünecek..."
    ></textarea>


    <button
        id="musicButton"
        onclick="createMusicWithLyrics()"
    >
        🎵 BU SÖZLERLE MÜZİK OLUŞTUR
    </button>


    <script type="module">

        import {
            pipeline
        } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


        let generator = null;


        const promptBox =
            document.getElementById("prompt");

        const resultBox =
            document.getElementById("result");

        const statusBox =
            document.getElementById("status");

        const generateButton =
            document.getElementById("generateButton");

        const musicButton =
            document.getElementById("musicButton");


        function setStatus(message, type = "") {

            statusBox.className = type;

            statusBox.textContent = message;
        }


        function cleanLyrics(text) {

            if (!text) {
                return "";
            }

            let lyrics = String(text);


            lyrics = lyrics
                .replace(/<\|im_start\|>/gi, "")
                .replace(/<\|im_end\|>/gi, "")
                .replace(/<\|endoftext\|>/gi, "")
                .replace(/<\|endofprompt\|>/gi, "")
                .replace(/<extra_id_\d+>/gi, "")
                .replace(/<pad>/gi, "")
                .replace(/<\/s>/gi, "")
                .replace(/<s>/gi, "")
                .replace(/assistant\s*:/gi, "")
                .trim();


            return lyrics;
        }


        function extractGeneratedText(output) {

            if (!output || !output.length) {
                return "";
            }


            let generated =
                output[0]?.generated_text;


            if (!generated) {
                return "";
            }


            if (Array.isArray(generated)) {

                const assistantMessage =
                    [...generated]
                        .reverse()
                        .find(
                            item =>
                                item &&
                                item.role === "assistant" &&
                                item.content
                        );


                if (assistantMessage) {

                    return cleanLyrics(
                        assistantMessage.content
                    );
                }


                const lastItem =
                    generated[generated.length - 1];


                if (
                    lastItem &&
                    typeof lastItem === "object"
                ) {

                    return cleanLyrics(
                        lastItem.content || ""
                    );
                }


                return cleanLyrics(
                    String(lastItem || "")
                );
            }


            return cleanLyrics(generated);
        }


        async function loadModel() {

            if (generator) {
                return;
            }


            setStatus(
                "🧠 Şarkı sözü yapay zekâsı hazırlanıyor...\n\n" +
                "İlk kullanımda model telefona indiriliyor.\n" +
                "Lütfen bekle...",
                "loading"
            );


            generator = await pipeline(
                "text-generation",
                "onnx-community/Qwen2.5-0.5B-Instruct",
                {
                    dtype: "q4"
                }
            );
        }


        /*
         * ÖNEMLİ:
         * Fonksiyonu window.generateLyrics olarak tanımlıyoruz.
         *
         * Böylece HTML'deki
         *
         * onclick="generateLyrics()"
         *
         * butonu bu fonksiyona erişebiliyor.
         */
        window.generateLyrics = async function() {

            const userPrompt =
                promptBox.value.trim();


            if (!userPrompt) {

                setStatus(
                    "❌ Önce şarkının konusunu yaz.",
                    "error"
                );

                return;
            }


            generateButton.disabled = true;

            musicButton.style.display = "none";

            resultBox.value = "";


            try {

                await loadModel();


                setStatus(
                    "✍️ Şarkı sözleri yazılıyor...\n\n" +
                    "Lütfen bekle.",
                    "loading"
                );


                const messages = [

                    {
                        role: "system",

                        content:
                            "Sen profesyonel bir Türkçe şarkı sözü yazarı ve besteci yardımcısısın. " +
                            "Kullanıcının verdiği konuya göre tamamen özgün Türkçe şarkı sözleri yaz. " +
                            "Şarkı sözleri doğal, akıcı ve söylenebilir olsun. " +
                            "Kıta, nakarat ve gerektiğinde köprü bölümleri oluştur. " +
                            "Nakarat akılda kalıcı olsun. " +
                            "Başka şarkılardan alıntı yapma. " +
                            "Tanınmış sanatçıların mevcut şarkı sözlerini taklit etme. " +
                            "Sadece şarkı sözlerini yaz. " +
                            "Açıklama veya yorum ekleme."
                    },

                    {
                        role: "user",

                        content:
                            "Şu konu hakkında özgün bir Türkçe şarkı sözü yaz:\n\n" +
                            userPrompt +
                            "\n\n" +
                            "Yaklaşık 3-4 kıta ve güçlü, tekrar edilebilir bir nakarat oluştur."
                    }

                ];


                const output =
                    await generator(
                        messages,
                        {
                            max_new_tokens: 450,
                            do_sample: true,
                            temperature: 0.85,
                            top_p: 0.9
                        }
                    );


                let lyrics =
                    extractGeneratedText(output);


                lyrics =
                    cleanLyrics(lyrics);


                if (
                    !lyrics ||
                    lyrics.length < 30
                ) {

                    throw new Error(
                        "Model anlamlı şarkı sözü üretemedi. Lütfen tekrar dene."
                    );
                }


                resultBox.value =
                    lyrics;


                setStatus(
                    "✅ Şarkı sözleri başarıyla oluşturuldu.",
                    "success"
                );


                musicButton.style.display =
                    "block";


                if (
                    window.AndroidBridge &&
                    typeof window.AndroidBridge.onLyricsGenerated ===
                        "function"
                ) {

                    window.AndroidBridge.onLyricsGenerated(
                        lyrics
                    );
                }

            }
            catch (error) {

                console.error(error);


                const message =
                    error?.message ||
                    String(error) ||
                    "Bilinmeyen hata";


                setStatus(
                    "❌ Hata: " + message,
                    "error"
                );


                resultBox.value = "";

                musicButton.style.display =
                    "none";


                if (
                    window.AndroidBridge &&
                    typeof window.AndroidBridge.onLyricsError ===
                        "function"
                ) {

                    window.AndroidBridge.onLyricsError(
                        message
                    );
                }

            }
            finally {

                generateButton.disabled =
                    false;
            }
        };


        window.createMusicWithLyrics =
            function() {

                const lyrics =
                    cleanLyrics(
                        resultBox.value.trim()
                    );


                if (
                    !lyrics ||
                    lyrics.length < 10
                ) {

                    setStatus(
                        "❌ Önce geçerli şarkı sözleri oluştur.",
                        "error"
                    );

                    return;
                }


                setStatus(
                    "🎵 Şarkı sözleri müzik sistemine gönderiliyor...",
                    "loading"
                );


                if (
                    window.AndroidBridge &&
                    typeof window.AndroidBridge.onLyricsMusicRequested ===
                        "function"
                ) {

                    window.AndroidBridge.onLyricsMusicRequested(
                        lyrics
                    );

                } else {

                    setStatus(
                        "❌ Android müzik bağlantısı bulunamadı.",
                        "error"
                    );
                }
            };


        setStatus(
            "Hazır. Şarkının konusunu yaz ve oluştur.",
            ""
        );

    </script>

</body>
</html>
