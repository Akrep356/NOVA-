name: Build NOVA APK

on:
  push:
    branches:
      - main
  workflow_dispatch: 

permissions:
  contents: read

jops:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actiona/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses:gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          APK=$(find . -type f -name
"*.apk | head -n 1)
         if [ -z "$APK" ]; then
           echo "APK bulumadi!"
           exit 1
        fi
        mkdir -p apk-output
        cp "$APK" apk-output/NOVA-debug.apk
        echo "hazirlanan APK:"
        ls -lh apk-output/NOVA-debug.apk
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-APK
          path: apk-output/NOVA-debug.apk
         if-no-files-found: error
