name:  Build NOVA APK

on: 
  push: 
    branches: 
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout
        uses:  actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:

          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Find APK
        run: |
          echo "APK DOSYALARI:"
          find . -type f -name "*.apk"-print

          
      - name: Upload APK
       uses:
actions/upload-artifact@v4
        with:
          name: NOVA-APK
          path: app/build/outputs/apk/debug/
app-debug.apk
